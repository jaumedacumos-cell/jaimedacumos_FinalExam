<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Catalog | Thread &amp; Lane</title>
<link rel="stylesheet" href="../assets/css/style.css"></head>
<body data-page="catalog">
<a class="skip-link" href="#main">Skip to content</a>
<nav class="navbar navbar-expand-md navbar-dark bg-ink sticky-top"><div class="container">
  <a class="navbar-brand" href="../index.html">Thread &amp; Lane</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto">
    <li class="nav-item"><a class="nav-link " href="../index.html">Home</a></li>
    <li class="nav-item"><a class="nav-link active" aria-current="page" href="../pages/catalog.html">Catalog</a></li>
    <li class="nav-item"><a class="nav-link " href="../pages/cart.html">Cart <span class="badge text-bg-warning" id="cartCount">0</span></a></li>
  </ul></div></div></nav>
<header class="page-head"><div class="container"><h1 class="h2 mb-0">Catalog</h1></div></header>
<main id="main" class="container py-4"><div class="row g-4">
  <aside class="col-lg-3" aria-label="Filters"><form id="filters" class="filters sticky-side" onsubmit="return false">
    <div class="mb-3"><label class="form-label fw-semibold" for="search">Search</label>
      <input type="search" id="search" class="form-control" placeholder="e.g. hoodie"></div>
    <div class="mb-3"><label class="form-label fw-semibold" for="category">Category</label>
      <select id="category" class="form-select"><option value="all">All categories</option><option>Tops</option><option>Bottoms</option><option>Outerwear</option><option>Dresses</option></select></div>
    <div class="mb-3"><label class="form-label fw-semibold" for="size">Size</label>
      <select id="size" class="form-select"><option value="all">Any size</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option></select></div>
    <div class="mb-3"><label class="form-label fw-semibold" for="maxPrice">Max price: <span id="priceLabel">₱2,000</span></label>
      <input type="range" id="maxPrice" class="form-range" min="300" max="2000" step="50" value="2000"></div>
    <div class="mb-3"><label class="form-label fw-semibold" for="sort">Sort by</label>
      <select id="sort" class="form-select"><option value="default">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name: A to Z</option></select></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="wishOnly"><label class="form-check-label" for="wishOnly">Show wishlist only</label></div>
    <button type="button" class="btn btn-outline-dark w-100" id="reset">Reset filters</button>
  </form></aside>
  <section class="col-lg-9" aria-live="polite"><p id="count" class="text-secondary"></p><div class="row g-3" id="grid"></div></section>
</div></main>
<footer><div class="container small">Thread &amp; Lane is a student frontend demonstration. Products are sample data and no real orders are processed.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script><script src="../assets/js/script.js"></script>
</body></html>
